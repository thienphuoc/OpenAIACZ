<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoClaw Hub — Admin</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --panel2:#1e2230; --border:#2a2f3f; --text:#e7eaf2; --muted:#8b93a7; --accent:#4f8cff; --ok:#3ddc84; --bad:#ff5c6c; --warn:#ffb347; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 22px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header h1 span { color:var(--accent); }
  .spacer { flex:1; }
  select, button, input { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font:inherit; outline:none; }
  button { cursor:pointer; transition:background .15s; }
  button:hover { background:#262b3b; }
  button.danger { color:var(--bad); border-color:#5e2d33; }
  button.danger:hover { background:#2d1518; }
  .container { max-width:1100px; margin:0 auto; padding:22px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card .val { font-size:28px; font-weight:700; }
  .card .lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .card.ok .val { color:var(--ok); }
  .card.bad .val { color:var(--bad); }
  h2 { font-size:15px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); }
  th { background:var(--panel2); font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:.5px; }
  td { font-size:13px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .dot.up { background:var(--ok); } .dot.down { background:var(--bad); } .dot.cd { background:var(--warn); } .dot.unknown { background:var(--muted); }
  .add-form { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .add-form input { flex:1; min-width:200px; }
  .add-form button { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .err-list { font-size:12px; color:var(--muted); max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  pre { font-size:11px; color:var(--muted); white-space:pre-wrap; max-height:100px; overflow-y:auto; }
</style>
</head>
<body>
<header>
  <h1>AutoClaw <span>Hub</span> Admin</h1>
  <select id="strategy">
    <option value="round-robin">Round-robin</option>
    <option value="fill-first">Fill-first</option>
  </select>
  <div class="spacer"></div>
  <button onclick="exportAuth()" style="background:var(--accent);color:#fff;border-color:var(--accent)">📤 Export Auth</button>
  <button onclick="document.getElementById('import-file').click()">📥 Import Auth</button>
  <input type="file" id="import-file" accept=".json" style="display:none" onchange="importAuth(this)" />
  <button onclick="refreshAll()">🔄 Refresh</button>
</header>

<div class="container">
  <div class="cards" id="cards"></div>

  <h2>Nodes</h2>
  <div class="add-form">
    <input id="n-url" placeholder="http://192.168.1.50:8787" />
    <input id="n-label" placeholder="Node label (tùy chọn)" style="max-width:200px" />
    <input id="n-apikey" placeholder="API key (nếu node có bật auth)" style="max-width:180px" />
    <button onclick="addNode()">+ Add Node</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Status</th><th>Label</th><th>URL</th><th>Latency</th><th>Models</th>
        <th>Requests</th><th>Success</th><th>Fail</th><th>Cooldown</th><th>Quota</th><th></th>
      </tr>
    </thead>
    <tbody id="nodes"></tbody>
  </table>

  <h2 style="margin-top:28px">Recent Errors</h2>
  <div id="errors" style="font-size:12px;color:var(--muted)"></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

async function api(method, path, body) {
  const opts = { method, headers: {} };
  const key = localStorage.getItem('ac_admin_key') || '';
  if (key) opts.headers['X-Admin-Key'] = key;
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  return res.json();
}

async function load() {
  try {
    const [nodesData, statsData] = await Promise.all([
      api('GET', '/admin/api/nodes'),
      api('GET', '/admin/api/stats'),
    ]);
    renderNodes(nodesData.nodes || []);
    renderStats(statsData);
    renderErrors(statsData);
    $('strategy').value = statsData.strategy || 'round-robin';
  } catch (e) {
    console.error(e);
    setTimeout(load, 3000);
  }
}

function renderStats(s) {
  const up = (s.nodes||[]).filter(n => n.status === 'up').length;
  const total = (s.nodes||[]).length;
  const reqs = (s.nodes||[]).reduce((a,n) => a + (n.requests||0), 0);
  const fails = (s.nodes||[]).reduce((a,n) => a + (n.fail||0), 0);
  const cds = (s.nodes||[]).filter(n => n.cooldown).length;
  $('cards').innerHTML = `
    <div class="card ${up===total&&total>0?'ok':up===0?'bad':''}"><div class="val">${up}/${total}</div><div class="lbl">Nodes up</div></div>
    <div class="card"><div class="val">${reqs}</div><div class="lbl">Total requests</div></div>
    <div class="card ${fails>0?'bad':''}"><div class="val">${fails}</div><div class="lbl">Failures</div></div>
    <div class="card ${cds>0?'bad':''}"><div class="val">${cds}</div><div class="lbl">On cooldown</div></div>
  `;
}

function renderNodes(ns) {
  $('nodes').innerHTML = ns.map(n => {
    const cls = n.cooldownUntil ? 'cd' : n.status;
    const statusLabel = n.cooldownUntil ? 'cooldown' : n.status;
    const quota = n.quotaStatus?.models
      ? `${n.quotaStatus.models.filter(m=>m.available).length}/${n.quotaStatus.models.length} ok`
      : '—';
    const errCount = (n.stats?.errors||[]).length;
    return `<tr>
      <td><span class="dot ${cls}"></span>${statusLabel}</td>
      <td>${esc(n.label)}</td>
      <td><code style="font-size:11px">${esc(n.url)}</code></td>
      <td>${n.latencyMs ? n.latencyMs+'ms' : '—'}</td>
      <td>${n.modelCount||0}</td>
      <td>${n.stats?.requests||0}</td>
      <td style="color:var(--ok)">${n.stats?.success||0}</td>
      <td style="color:var(--bad)">${n.stats?.fail||0}</td>
      <td>${n.cooldownUntil ? new Date(n.cooldownUntil).toLocaleTimeString() : '—'}</td>
      <td>${quota}</td>
      <td>
        <button onclick="refreshNode('${n.id}')" style="padding:4px 8px;font-size:12px">🔄</button>
        <button class="danger" onclick="delNode('${n.id}')" style="padding:4px 8px;font-size:12px">✕</button>
      </td>
    </tr>`;
  }).join('');
}

function renderErrors(s) {
  const errs = [];
  for (const n of (s.nodes||[])) {
    for (const e of (n.recentErrors||[])) {
      errs.push({ node: n.label, ...e });
    }
  }
  errs.sort((a,b) => (b.ts||0) - (a.ts||0));
  $('errors').innerHTML = errs.length
    ? errs.slice(0,15).map(e => `<div style="margin-bottom:4px"><span style="color:var(--bad)">⚠</span> [${new Date(e.ts).toLocaleTimeString()}] ${esc(e.node)}: ${esc(e.reason||'')}</div>`).join('')
    : '<div style="color:var(--ok)">No errors ✅</div>';
}

async function addNode() {
  const url = $('n-url').value.trim();
  if (!url) return;
  await api('POST', '/admin/api/nodes', { url, label: $('n-label').value.trim() || undefined, apiKey: $('n-apikey').value.trim() || undefined });
  $('n-url').value = ''; $('n-label').value = ''; $('n-apikey').value = '';
  load();
}

async function delNode(id) {
  await api('DELETE', '/admin/api/nodes/' + id);
  load();
}

async function refreshNode(id) {
  await api('POST', '/admin/api/nodes/' + id + '/refresh');
  load();
}

async function refreshAll() {
  const data = await api('GET', '/admin/api/nodes');
  await Promise.all((data.nodes||[]).map(n => api('POST', '/admin/api/nodes/' + n.id + '/refresh')));
  load();
}

$('strategy').onchange = async () => {
  await api('PUT', '/admin/api/strategy', { strategy: $('strategy').value });
  load();
};

// ---------- auth export / import ----------
async function exportAuth() {
  try {
    const data = await api('GET', '/admin/api/auth/export');
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `autoclaw-auth-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    alert('✅ Đã tải file auth. Copy sang máy khác → mở admin panel → Import Auth → restart node.');
  } catch (e) {
    alert('❌ Export lỗi: ' + e.message);
  }
}

async function importAuth(input) {
  const file = input.files[0];
  if (!file) return;
  if (!confirm('Import auth sẽ ghi đè .gateway-token + device.json + JWT trên máy này. Tiếp tục?')) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const res = await fetch('/admin/api/auth/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': localStorage.getItem('ac_admin_key') || '' },
      body: JSON.stringify(data),
    });
    const result = await res.json();
    if (result.ok) {
      alert('✅ ' + result.message + '\n\nGiờ restart node (Ctrl+C rồi npm start lại) để load auth mới.');
      load();
    } else {
      alert('❌ ' + (result.error?.message || 'import failed'));
    }
  } catch (e) {
    alert('❌ Import lỗi: ' + e.message);
  }
  input.value = '';
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// auto-refresh every 10s
load();
setInterval(load, 10000);
</script>
</body>
</html>
